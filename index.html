<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Security | Password Strength Checker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Courier New', monospace;
    }

    body {
      height: 100vh;
      background: black;
      color: #00ff88;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(0, 0, 0, 0.7);
      padding: 30px 40px;
      border: 1px solid #00ff88;
      border-radius: 15px;
      box-shadow: 0 0 25px #00ff88;
      text-align: center;
      width: 380px;
      animation: glow 3s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 10px #00ff88; }
      to { box-shadow: 0 0 25px #00ffaa; }
    }

    h1 {
      font-size: 1.6em;
      margin-bottom: 15px;
      color: #00ff88;
      text-shadow: 0 0 10px #00ff88;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      outline: none;
      background: #111;
      color: #00ff88;
      text-align: center;
    }

    #strength-bar {
      height: 10px;
      width: 90%;
      background: #222;
      border-radius: 5px;
      margin: 10px auto;
    }

    #strength {
      height: 100%;
      width: 0%;
      border-radius: 5px;
      transition: width 0.3s;
    }

    #message {
      margin-top: 10px;
      font-size: 0.9em;
      color: #00ffaa;
    }

    .awareness {
      text-align: left;
      font-size: 0.85em;
      margin-top: 20px;
      color: #80ffb3;
    }

    .awareness h2 {
      font-size: 1.1em;
      margin-bottom: 5px;
      color: #00ffaa;
      text-shadow: 0 0 10px #00ff88;
    }

    ul {
      margin-left: 15px;
    }

    li {
      margin-bottom: 5px;
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="container">
    <h1>🕶️ Password Strength Checker</h1>
    <input type="password" id="password" placeholder="Enter your password" />
    <div id="strength-bar"><div id="strength"></div></div>
    <div id="message"></div>

    <div class="awareness">
      <h2>Cybersecurity Tips:</h2>
      <ul>
        <li>Use 12+ characters mixing upper/lowercase, numbers, and symbols.</li>
        <li>Don’t reuse passwords on different accounts.</li>
        <li>Enable Two-Factor Authentication (2FA).</li>
        <li>Use password managers like Bitwarden or 1Password.</li>
      </ul>
    </div>
  </div>

  <script>
    // PASSWORD STRENGTH SCRIPT
    const password = document.getElementById('password');
    const strengthBar = document.getElementById('strength');
    const message = document.getElementById('message');

    password.addEventListener('input', () => {
      const val = password.value;
      let strength = 0;

      if (val.length >= 8) strength++;
      if (val.match(/[A-Z]/)) strength++;
      if (val.match(/[0-9]/)) strength++;
      if (val.match(/[^A-Za-z0-9]/)) strength++;

      switch (strength) {
        case 0:
          strengthBar.style.width = "0%";
          message.textContent = "";
          break;
        case 1:
          strengthBar.style.width = "25%";
          strengthBar.style.background = "red";
          message.textContent = "Weak password ⚠️";
          break;
        case 2:
          strengthBar.style.width = "50%";
          strengthBar.style.background = "orange";
          message.textContent = "Moderate strength 🔸";
          break;
        case 3:
          strengthBar.style.width = "75%";
          strengthBar.style.background = "yellow";
          message.textContent = "Strong password 💪";
          break;
        case 4:
          strengthBar.style.width = "100%";
          strengthBar.style.background = "lime";
          message.textContent = "Very strong password ✅";
          break;
      }
    });

    // MATRIX RAIN BACKGROUND
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;

    const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%^&*+-=<>?";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#00ff88";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(draw, 33);
  </script>

</body>
</html>
